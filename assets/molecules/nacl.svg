<svg viewBox="0 0 200 160" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bond{stroke:#26344C;stroke-width:2.5;fill:none;stroke-dasharray:2 6;stroke-linecap:round;}
    .atom{font-family:Georgia,'Times New Roman',serif;font-weight:700;font-size:24px;fill:#26344C;paint-order:stroke;stroke:#FBF6EA;stroke-width:7px;stroke-linejoin:round;text-anchor:middle;}
    .charge{font-family:Georgia,serif;font-weight:700;font-size:15px;fill:#26344C;}
    .lattice{fill:#26344C;opacity:0.35;}
  </style>
  <!-- legame ionico (tratteggiato per indicare elettrostatico, non covalente) -->
  <path class="bond" d="M62,80 L138,80"/>
  <text class="atom" x="52" y="88">Na</text>
  <text class="charge" x="72" y="60">+</text>
  <text class="atom" x="148" y="88">Cl</text>
  <text class="charge" x="170" y="60">–</text>
  <!-- piccoli punti reticolo per suggerire il cristallo -->
  <circle class="lattice" cx="35" cy="130" r="4"/>
  <circle class="lattice" cx="70" cy="130" r="4"/>
  <circle class="lattice" cx="105" cy="130" r="4"/>
  <circle class="lattice" cx="140" cy="130" r="4"/>
  <circle class="lattice" cx="165" cy="130" r="4"/>
</svg>
